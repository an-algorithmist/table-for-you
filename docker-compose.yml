name: nebulaiq
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nebula
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nebula_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  nebula_pg:
